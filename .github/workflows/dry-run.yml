name: SNS Auto Post (Dry-Run)

on:
  schedule:
    # ===== GlobeSNS × X: 1日3回 =====
    - cron: '0 23 * * *'
    - cron: '30 3 * * *'
    - cron: '0 11 * * *'

    # ===== GlobeSNS × Threads: 1日3回 =====
    - cron: '30 23 * * *'
    - cron: '0 4 * * *'
    - cron: '30 11 * * *'

    # ===== spi_webtesting × X: 1日3回 =====
    - cron: '0 0 * * *'
    - cron: '0 5 * * *'
    - cron: '0 12 * * *'

    # ===== webtest_Answer_ × X: 1日3回 =====
    - cron: '0 1 * * *'
    - cron: '30 6 * * *'
    - cron: '0 13 * * *'

  workflow_dispatch:
    inputs:
      account:
        description: 'Account profile ID (e.g. globesns-x, spi-webtest-x, webtest-answer-x)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Determine account from schedule
        id: account
        run: |
          if [ -n "${{ github.event.inputs.account }}" ]; then
            echo "id=${{ github.event.inputs.account }}" >> $GITHUB_OUTPUT
          else
            CRON="${{ github.event.schedule }}"
            case "$CRON" in
              "0 23 * * *"|"30 3 * * *"|"0 11 * * *")
                echo "id=globesns-x" >> $GITHUB_OUTPUT ;;
              "30 23 * * *"|"0 4 * * *"|"30 11 * * *")
                echo "id=globesns-threads" >> $GITHUB_OUTPUT ;;
              "0 0 * * *"|"0 5 * * *"|"0 12 * * *")
                echo "id=spi-webtest-x" >> $GITHUB_OUTPUT ;;
              "0 1 * * *"|"30 6 * * *"|"0 13 * * *")
                echo "id=webtest-answer-x" >> $GITHUB_OUTPUT ;;
              *)
                echo "id=globesns-x" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Run dry-run
        run: npx tsx src/cli/index.ts post --account ${{ steps.account.outputs.id }} --mode dry-run
